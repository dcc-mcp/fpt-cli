name: Hakari Autofix

# `workspace-hack/Cargo.toml` is a generated artifact of the dependency graph.
# A dependency bump that changes the feature graph leaves it stale, and `just ci`
# then fails on its `hakari-check` step. This workflow regenerates the generated
# files on bot dependency PRs, so a bump and its generated output land on the
# same branch instead of silently rotting on main.
#
# Renovate's `postUpgradeTasks.commands` is deliberately not used: `allowedCommands`
# is a global-only option, so the hosted Mend Renovate App cannot allowlist the
# command and it would never run.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to regenerate workspace-hack on"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: hakari-autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  # Pinned: an unpinned cargo-hakari can flip `hakari-check` without any
  # dependency change. Keep in sync with .github/workflows/ci.yml.
  CARGO_HAKARI_VERSION: "0.9.38"

jobs:
  regenerate:
    name: Regenerate workspace-hack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # In-repo bot branches only: never check out fork code with a write token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.fork == false &&
       contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.ref }}
          # Dependabot-triggered runs receive a read-only GITHUB_TOKEN, so
          # pushing from those runs needs a PAT stored as a Dependabot secret.
          # Without it the job falls back to the read-only token and only
          # reports the drift.
          token: ${{ secrets.HAKARI_AUTOFIX_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup vx
        uses: loonghao/vx@main
        with:
          version: "0.8.0"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key-prefix: vx-tools-${{ runner.os }}-${{ runner.arch }}

      - name: Setup tools (vx)
        run: vx setup

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pinned cargo-hakari
        run: vx cargo install cargo-hakari --locked --version "${CARGO_HAKARI_VERSION}"

      - name: Detect workspace-hack drift
        id: drift
        run: |
          if vx cargo hakari generate --diff; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "workspace-hack is up to date."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::workspace-hack is stale; regenerating."
          fi

      - name: Regenerate workspace-hack
        if: steps.drift.outputs.drift == 'true'
        run: vx just hakari-generate

      - name: Commit and push regenerated files
        if: steps.drift.outputs.drift == 'true'
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || inputs.ref }}
        run: |
          set -u

          if git diff --quiet -- Cargo.toml Cargo.lock workspace-hack crates; then
            echo "::notice::Regeneration produced no file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Cargo.toml Cargo.lock workspace-hack crates
          git commit -m "chore(hakari): regenerate workspace-hack"

          if git push origin "HEAD:refs/heads/${TARGET_REF}"; then
            echo "Regenerated \`workspace-hack\` and pushed to \`${TARGET_REF}\`." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning::Detected workspace-hack drift but could not push to ${TARGET_REF}. Dependabot-triggered runs get a read-only GITHUB_TOKEN: add a PAT as the Dependabot secret HAKARI_AUTOFIX_TOKEN, or run 'vx just hakari-generate' locally."
          {
            echo "### workspace-hack drift detected"
            echo ""
            echo "Regenerated the files locally but could not push to \`${TARGET_REF}\`."
            echo ""
            echo "Run \`vx just hakari-generate\` and commit the result, or configure the"
            echo "\`HAKARI_AUTOFIX_TOKEN\` Dependabot secret so this workflow can push."
          } >> "$GITHUB_STEP_SUMMARY"
